name: Deploy CodeForge Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble the static site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install Jinja2==3.1.6
          python pages/assemble.py dist
          mkdir -p dist/runtime-v4
          gh release download pages-runtime-v4 --pattern '*.tar' --dir "${RUNNER_TEMP}"
          tar -xf "${RUNNER_TEMP}/codeforge-pages-runtime-v4.tar" -C dist/runtime-v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
