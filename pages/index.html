<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeForge · Eiffel AutoProof</title>
<link rel="stylesheet" href="style.css">
<main>
  <header><h1>CodeForge</h1><p>Eiffel and AutoProof in your browser</p></header>
  <div class="toolbar">
    <label>Source file <select id="files"></select></label>
    <button id="add" type="button">Add file</button>
    <button id="remove" type="button">Remove file</button>
    <button id="verify" type="button">Verify with AutoProof</button>
  </div>
  <div class="panes">
    <label class="panel">Eiffel source<textarea id="editor" spellcheck="false"></textarea></label>
    <section class="panel" aria-labelledby="results"><h2 id="results">Verification</h2>
      <p id="status" role="status">The VM starts on the first verification and stays open for later edits.</p>
      <pre id="output" aria-live="off"></pre>
    </section>
  </div>
  <footer><a href="sources.html">Runtime sources</a></footer>
</main>
<script type="module" src="app.js?v=3"></script>
</html>
